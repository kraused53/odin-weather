<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Weather App</title>
  </head>

  <body>
    <div id="page-container">
      <header>
        <h1 id="header-hero">Weather App</h1>
        <div id="search-bar">
          <form action="" id="location-search">
            <input
              type="text"
              id="location-input"
              name="location-input"
              placeholder="Enter a location"
            />
            <button id="location-submit" type="submit">Search</button>
          </form>
        </div>
      </header>
      <main></main>
    </div>

    <dialog id="error-dialog" closedby="any">
      <h1 id="error-hero"></h1>
      <p id="error-body"></p>
    </dialog>
  </body>
</html>
